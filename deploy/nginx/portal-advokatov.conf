# Portal Advokatov — Nginx site (HTTP only until a domain exists)
#
# VPN SAFETY:
# - Listen TCP 80 and TCP 8080 only
# - Do NOT listen on UDP 443 / TCP 443 / TCP 2096 / TCP 2097
# - Do NOT conflict with Hysteria2, 3x-ui, or xray
# - Upstream is loopback Next.js only

upstream portal_advokatov_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://portal_advokatov_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
